name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: us-central1
  SERVICE_NAME: navi-landing

jobs:
  # Get version from package.json. Auto-bumps the patch if the version was
  # already released, so devs don't have to remember to bump on every push.
  # Manual bumps in package.json (e.g. for minor/major releases) are honored
  # whenever the new version doesn't have a release yet.
  get-version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Determine version (auto-bump if already released)
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          CURRENT=$(jq -r '.version' packages/navi-app/package.json)
          echo "package.json version: $CURRENT"

          if gh release view "v$CURRENT" >/dev/null 2>&1; then
            IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
            NEW="${MAJOR}.${MINOR}.$((PATCH + 1))"
            echo "v$CURRENT already released — auto-bumping to v$NEW"

            jq --arg v "$NEW" '.version = $v' packages/navi-app/package.json > packages/navi-app/package.json.tmp
            mv packages/navi-app/package.json.tmp packages/navi-app/package.json

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add packages/navi-app/package.json
            git commit -m "chore: auto-bump version to $NEW [skip ci]"
            git push origin HEAD:main

            echo "version=$NEW" >> "$GITHUB_OUTPUT"
          else
            echo "v$CURRENT has no release yet — using as-is"
            echo "version=$CURRENT" >> "$GITHUB_OUTPUT"
          fi

  # Build CLI tarball — the only distributable. Browser OTA for git installs
  # updates via git pull (server/routes/update.ts); tarball installs update
  # via this asset (bin/navi.ts `navi update` and /api/update fallback).
  build-cli:
    needs: [get-version]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Package CLI tarball
        run: |
          VERSION="${{ needs.get-version.outputs.version }}"
          STAGING="navi-cli"
          mkdir -p "$STAGING"

          # Copy only what the CLI needs
          cp -r packages/navi-app "$STAGING/navi-app"

          # Remove stuff users don't need
          rm -rf "$STAGING/navi-app/node_modules"
          rm -rf "$STAGING/navi-app/build"
          rm -rf "$STAGING/navi-app/.tmp*"

          # Add a version marker
          echo "$VERSION" > "$STAGING/navi-app/.version"

          tar -czf "navi-cli-${VERSION}.tar.gz" -C "$STAGING" navi-app
          ls -lh "navi-cli-${VERSION}.tar.gz"

      - name: Upload CLI artifact
        uses: actions/upload-artifact@v4
        with:
          name: navi-cli
          path: navi-cli-*.tar.gz

  # Create GitHub Release with the CLI tarball
  create-release:
    needs: [get-version, build-cli]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release assets
        run: |
          mkdir -p release-assets
          find artifacts -name "navi-cli-*.tar.gz" -exec cp {} release-assets/ \;
          ls -la release-assets/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.get-version.outputs.version }}
          name: Navi v${{ needs.get-version.outputs.version }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Deploy landing page
  deploy:
    needs: [create-release]
    if: always() && needs.create-release.result == 'success'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Auth to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Build landing page
        working-directory: packages/landing-page
        run: |
          bun install
          bun run build

      - name: Build and push Docker image
        working-directory: packages/landing-page
        run: |
          IMAGE=${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/navi/landing:${{ github.sha }}
          docker build -t $IMAGE .
          docker push $IMAGE

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/navi/landing:${{ github.sha }} \
            --region ${{ env.REGION }} \
            --platform managed \
            --allow-unauthenticated \
            --memory 256Mi \
            --cpu 1 \
            --min-instances 0 \
            --max-instances 10
